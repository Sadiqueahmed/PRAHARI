# ====================================================================
# Project Prahari — Development Profile Overrides
# ====================================================================
# Activate with: --spring.profiles.active=dev
# ====================================================================

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update   # Auto-create/update schema in dev (Flyway handles prod)
  flyway:
    enabled: true         # Flyway runs V1__init_schema.sql to set up PostGIS extensions

logging:
  level:
    com.prahari: DEBUG
    org.hibernate.SQL: DEBUG
