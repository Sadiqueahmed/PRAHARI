# ====================================================================
# Project Prahari — Development Profile Overrides
# ====================================================================
# Activate with: --spring.profiles.active=dev
# ====================================================================

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update   # Auto-create/update schema in dev (Flyway handles prod)
  flyway:
    enabled: false        # Docker init scripts handle schema in dev; Flyway for prod only

logging:
  level:
    com.prahari: DEBUG
    org.hibernate.SQL: DEBUG
