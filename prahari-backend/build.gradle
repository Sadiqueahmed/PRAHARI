// ====================================================================
// Project Prahari — Spring Boot Backend Build Configuration
// ====================================================================
// Tech: Java 21, Spring Boot 3.3.x, Hibernate Spatial, PostGIS, JWT
// ====================================================================

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.prahari'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // ---- Spring Boot Starters ----
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'   // WebClient for external APIs

    // ---- PostGIS / Spatial ----
    // Hibernate Spatial is bundled in Hibernate 6 — provides JTS geometry mapping
    implementation 'org.hibernate.orm:hibernate-spatial'

    // JTS IO Common — contains GeoJsonReader/GeoJsonWriter for parsing GeoJSON
    implementation 'org.locationtech.jts.io:jts-io-common:1.20.0'

    // Jackson module for serializing JTS geometries to/from GeoJSON
    implementation 'org.n52.jackson:jackson-datatype-jts:1.2.10'

    // ---- JWT Authentication ----
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // ---- Database ----
    runtimeOnly 'org.postgresql:postgresql'

    // ---- Database Migration ----
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // ---- Utility ----
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ---- Testing ----
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Virtual threads are GA in Java 21+ — no preview flag needed
bootRun {
    // Pass env vars from .env to the JVM
    systemProperty 'spring.profiles.active', 'dev'
}
