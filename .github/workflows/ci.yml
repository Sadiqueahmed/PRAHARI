name: Prahari CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ====================================================================
  # Frontend — Build + Lint
  # ====================================================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prahari-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prahari-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

  # ====================================================================
  # Backend — Compile + Test
  # ====================================================================
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prahari-backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test --no-daemon

  # ====================================================================
  # Python Ingestion — Syntax Check
  # ====================================================================
  ingestion:
    name: Ingestion Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prahari-ingestion

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check syntax
        run: python -m py_compile run_all.py aqicn_poller.py usgs_poller.py cwc_scraper.py lhasa_processor.py db.py config.py
